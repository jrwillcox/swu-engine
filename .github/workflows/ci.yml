name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      # Scoped to the typed core (src/swu/abilities + engine/state.py) by the
      # `files` key in [tool.mypy]; see the comment there.
      - name: Typecheck (typed core)
        run: mypy

      # NOTE ON SCOPE: data/swu.db is not in the repository — the card corpus is
      # the publisher's IP and is rebuilt locally by scripts/ (see README). These
      # tests run against the committed fixture (tests/fixtures/swu_fixture.db);
      # those that need the whole corpus (per-set card suites, coverage audit,
      # reprint sweep, deck gates) skip with a reason. The full run of over
      # 5,600 tests happens locally after a pipeline build.
      - name: Tests (fixture tier)
        run: pytest -q

      # With no database at all, tests that need card data must skip, not fail.
      # They guard with the require_* helpers in tests/dbpath.py; this run keeps
      # a new test from forgetting to.
      - name: Tests (no database)
        env:
          SWU_DB: /nonexistent/swu.db
        run: pytest -q

      - name: Import check
        run: |
          python -c "import swu.engine.actions, swu.abilities.registry, swu.abilities.resolver"
          python -c "import swu.web.app"

  web:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches web/.nvmrc and the >=20.19 floor in web/package.json
          # (Vite 7 requires it).
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
